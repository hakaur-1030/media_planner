<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media Planner — First Page Preview</title>
  <style>
    :root{--bg:#fbfaf6;--surface:#fff;--ink:#1f2128;--muted:#5c606b;--line:#e9dfbf;--gold:#ffcf33;--soft:#fff3bf;--radius:18px;font-family:Arial,sans-serif}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top left,#fff7d8 0,#fbfaf6 42%,#f3f4f7 100%);color:var(--ink)}
    nav{height:60px;padding:0 clamp(24px,3vw,56px);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
    .brand{font-weight:800;font-size:22px}.brand b{background:var(--gold);padding:3px 6px;border-radius:5px}.steps{display:flex;gap:7px}.step{padding:7px 12px;border-radius:999px;background:#eaf8f0;color:#0d5a38;font-size:12px;font-weight:700}.step.current{background:var(--ink);color:var(--gold)}
    main{width:100%;max-width:1920px;margin:auto;padding:24px clamp(24px,3vw,56px)} .card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:0 12px 30px rgba(31,33,40,.06)}
    h2{font-size:15px;margin:0 0 18px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:7px}.field label,.eyebrow{font-size:12px;color:var(--muted);font-weight:700}.input{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;background:#fff}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:99px;padding:8px 13px;background:#fff;font-size:13px}.pill.selected{background:var(--soft);border-color:var(--gold);font-weight:700}
    .split{margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#fffdf3,#f7f1db)}.split-row{display:flex;align-items:center;gap:14px;margin-top:12px}.split-row span:first-child{width:180px;font-size:13px;font-weight:700}.split-row input[type=range]{flex:1;accent-color:var(--gold)}.percent{width:78px;height:36px;border:1px solid var(--line);border-radius:8px;text-align:right;padding:0 9px;font-weight:700}.pct{width:42px;font-weight:700;color:var(--muted)}.button-row{display:flex;justify-content:flex-end;margin-top:18px}.button{padding:11px 18px;background:var(--ink);color:var(--gold);border:0;border-radius:10px;font-size:14px;font-weight:700}
    @media(max-width:760px){.steps{display:none}.grid{grid-template-columns:1fr}.split-row span:first-child{width:95px}.split-row{gap:8px}main{padding:16px}}
  </style>
</head>
<body>
  <nav><div class="brand">noon<b>ads</b></div><div class="steps"><span class="step current">Plan Initialization</span><span class="step">Objective</span><span class="step">Budget &amp; Scheduling</span><span class="step">Slot Preselection</span></div></nav>
  <main>
    <section class="card">
      <h2>Brand Details</h2>
      <div class="grid">
        <div class="field"><label>Brand code</label><input class="input" placeholder="Search brand code or type a brand"><span style="font-size:12px;color:var(--muted)">Type at least 2 characters to search brand codes.</span></div>
        <div class="field"><label>Countries</label><div class="pills"><span class="pill">AE</span><span class="pill selected">SA</span><span class="pill">EG</span></div></div>
        <div class="field"><label>Marketplace</label><div class="pills"><span class="pill selected">Both</span><span class="pill">Core</span><span class="pill">Supermall</span></div></div>
      </div>
      <div class="split"><div class="eyebrow">Brand budget split</div><div class="split-row"><span>Primary brand</span><input type="range" min="0" max="100" value="65"><input class="percent" value="65"><span class="pct">%</span></div><div class="split-row"><span>Secondary brand</span><input type="range" min="0" max="100" value="35"><input class="percent" value="35"><span class="pct">%</span></div></div>
    </section>
    <section class="card"><h2>Comcat Selection</h2><div class="pills"><span class="pill selected">Mobiles</span><span class="pill">Home &amp; Kitchen</span><span class="pill">Beauty</span><span class="pill">Fashion</span></div></section>
    <div class="button-row"><button class="button">Next: Objective →</button></div>
  </main>
</body>
</html>
